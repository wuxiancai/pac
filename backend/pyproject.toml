[project]
name = "personal-ai-assistant-phase0-poc"
version = "0.1.0"
description = "Local-only Phase 0 proof of concept"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "sherpa-onnx==2.0.1",
    "sounddevice==0.5.6",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
phase0-security = [
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "sqlcipher3==0.6.3",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.setuptools.packages.find]
include = ["pac_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
