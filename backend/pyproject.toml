[project]
name = "personal-ai-assistant-phase0-poc"
version = "0.1.0"
description = "Local-only Phase 0 proof of concept"
requires-python = ">=3.11,<3.14"
dependencies = [
    "fastapi==0.159.1",
    "httpx==0.28.1",
    "sherpa-onnx==2.0.1",
    "sounddevice==0.5.6",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.optional-dependencies]
phase0-security = [
    "alembic>=1.13,<2",
    "sqlalchemy>=2.0,<3",
    "sqlcipher3==0.6.3",
]
phase0-embedding = [
    "fastembed==0.9.1",
]

[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "detect-secrets>=1.5.0",
    "mypy>=2.4.1",
    "pytest==8.4.2",
    "ruff>=0.17.4",
]

[tool.setuptools.packages.find]
include = ["pac_poc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.11"
files = ["pac_poc/security_poc.py", "pac_poc/local_service.py", "pac_poc/beta_api.py"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_configs = true
